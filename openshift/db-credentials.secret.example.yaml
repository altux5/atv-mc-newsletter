# DB credentials for the newsletter app backend.
#
# This is an EXAMPLE / template. Do NOT put the real password here — this file
# is committed to git. To create the real secret safely:
#   1. Copy this file to openshift/db-credentials.secret.yaml (gitignored).
#   2. Put the real newsletter_app password in that copy.
#   3. Apply it into the APP namespace (not the -psql namespace):
#        oc apply -f openshift/db-credentials.secret.yaml
#   4. The Knative service reads these as env vars automatically: deploy.ps1
#      wires the secret in via envFrom (oc set env does NOT work on Knative).
#
# The server (server/db.ts) reads PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD.
# SSL is enabled automatically (StackGres/pgBouncer require it); no PGSSLMODE needed.
apiVersion: v1
kind: Secret
metadata:
  name: newsletter-db
  namespace: atv-mc-newsletter-development
type: Opaque
stringData:
  PGHOST: atv-news-stackgres-clust.atv-mc-newsletter-psql.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: newsletter
  PGUSER: newsletter_app
  PGPASSWORD: REPLACE_WITH_APP_DB_PASSWORD
